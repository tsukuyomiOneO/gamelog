[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Переменные SUPABASE_URL и SUPABASE_ANON_KEY задаются в настройках Netlify по контекстам:
#   production                      боевой проект Supabase
#   deploy-preview, branch-deploy   тестовый проект Supabase
